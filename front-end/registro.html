<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Proveedor</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="container">
<h1 class="mt-4">Registro de Proveedor</h1>
<form id="register-provider-form" class="mt-4">
    <div class="form-group">
        <input type="text" id="provider-name" class="form-control" placeholder="Nombre">
    </div>
    <div class="form-group">
        <input type="email" id="provider-email" class="form-control" placeholder="Email">
    </div>
    <div class="form-group">
        <input type="text" id="provider-phone" class="form-control" placeholder="Teléfono">
    </div>
    <button type="submit" class="btn btn-primary">Registrar</button>
</form>
<script src="registro.js"></script>
</body>
</html>
