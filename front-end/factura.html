<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facturación</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="container">
<h1 class="mt-4">Facturación</h1>
<form id="factura-form" class="mt-4">
    <div class="form-group">
        <input type="text" id="factura-provider" class="form-control" placeholder="Proveedor">
    </div>
    <div class="form-group">
        <input type="text" id="factura-client" class="form-control" placeholder="Cliente">
    </div>
    <div class="form-group">
        <input type="date" id="factura-date" class="form-control">
    </div>
    <div class="form-group">
        <input type="number" id="factura-total" class="form-control" placeholder="Total">
    </div>
    <button type="submit" class="btn btn-primary">Generar Factura</button>
</form>
<script src="factura.js"></script>
</body>
</html>
