<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Productos</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="container">
<h1 class="mt-4">Lista de Productos</h1>
<ul id="product-list" class="list-group mt-4"></ul>
<div class="form-group mt-4">
    <input type="text" id="new-product-name" class="form-control" placeholder="Nombre del producto">
    <input type="number" id="new-product-price" class="form-control mt-2" placeholder="Precio del producto">
    <button id="add-product" class="btn btn-primary mt-2">Agregar Producto</button>
</div>
<script src="producto.js"></script>
</body>
</html>
